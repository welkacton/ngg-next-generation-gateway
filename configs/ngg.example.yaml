server:
    listen: 127.0.0.1
    port: 9090
    token: ""
    web_dir: web/dist
storage:
    dir: data
cores:
    descriptor_dir: configs/cores.d
    port_base: 17890
    port_stride: 10
supervisor:
    stop_timeout: 5s
    restart_max: 3
    restart_backoff: 2s
logging:
    level: info
    dir: data/logs
    ring_capacity: 4000
network:
    enabled: true
    fail_closed: true
    failover: true
    ingress:
        enabled: true
        listen: 127.0.0.1
        port: 18080
        auth_user: ""
        auth_pass: ""
    tun:
        name: NGG
        mtu: 1500
        ipv4: 10.89.0.1/24
        ipv6: fd89::1/64
        autoroute: false
        strictroute: true
    dns:
        enabled: true
        listen: 127.0.0.1
        port: 18053
        upstreams:
            - 223.5.5.5:53
            - 119.29.29.29:53
        cache_ttl: 60
        hosts: {}
        block: []
    egress:
        interface: ""
        local_addr: ""
        mark: 20039
        bypass_tun: true
    default_core: ""
    direct_on_failure: false

# 交叉编译用的 Go 工具链路径（服务以 daemon 运行时 PATH 常不含 go）
build:
  go_binary: ""
