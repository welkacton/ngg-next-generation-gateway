# NGG Stage 5 SD-WAN 链路示例（逐条 POST /api/v1/sdwan/links）
links:
  - id: wan1
    name: 主线路
    interface: eth0
    gateway: 192.168.1.1
    probe_target: "223.5.5.5:53"
    weight: 10
    cost: 1
    priority: 100
    enabled: true
  - id: wan2
    name: 备用线路
    interface: eth1
    gateway: 192.168.2.1
    probe_target: "119.29.29.29:53"
    weight: 5
    cost: 2
    priority: 50
    enabled: true
