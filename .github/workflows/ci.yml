name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l ./cmd ./internal ./pkg)"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit + integration tests
        run: go test -p 2 ./... -count=1 -timeout 240s
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
  deployment-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax check
        run: |
          set -e
          for f in scripts/*.sh scripts/docker-entrypoint.sh platforms/*.sh deploy/**/*.example; do
            [ -f "$f" ] || continue
            case "$f" in *.sh|*/docker-entrypoint.sh) bash -n "$f" ;; esac
          done
          bash -n scripts/deploy-vps.sh
          echo "shell syntax OK"
      - name: Validate workflows and example config YAML
        run: |
          python3 - <<'PY'
          import glob, sys
          import yaml
          files = glob.glob('.github/workflows/*.yml') + ['configs/ngg.example.yaml', 'docker-compose.yml']
          for path in files:
              with open(path, encoding='utf-8') as f:
                  yaml.safe_load(f)
              print('yaml ok:', path)
          PY
  windows-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell installer and update scripts
        shell: pwsh
        run: |
          $failed = 0
          $files = @(Get-ChildItem installer/windows -Filter *.ps1) + @(Get-ChildItem scripts -Filter *.ps1)
          $files | ForEach-Object {
            $tokens = $null; $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errs) | Out-Null
            if ($errs.Count -gt 0) {
              Write-Error "Syntax errors in $($_.Name):"
              $errs | ForEach-Object { Write-Error $_.Message }
              $failed++
            } else { Write-Host "parse ok: $($_.Name)" }
          }
          if ($failed -gt 0) { exit 1 }
